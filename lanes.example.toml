# Copy to <your state directory>/lanes.toml. Each [lanes.<name>] table is a resource: a box (or pool of boxes) that runs
# jobs, priced by attention, not rental: a $/h that says what an hour of it is worth to you, plus optional prices for
# whatever else a run consumes. The prices below are examples (the Pit's dollars are play money).
#   cost = wall_h x usd_per_h + sum over the run's meters of meter x price        (pit.lanes.cost_line)
# A run reports its meters on its report line: pit: verdict=pass wall_s=S meters={"tok_in": N, "tok_out": N} result={...}
# A meter `tok_<x>` is priced by usd_per_mtok_<x> (per million), any other meter `<m>` by usd_per_<m> (per unit);
# a meter with no price is recorded on the result and not charged.
# A post states its claim: claim = "..." in the job spec, or q post --claim "...". Reads and house bag draws are exempt.
# A job is funded in dollars (budget_usd): the run is killed when its time alone has spent the funding
# (budget_usd / usd_per_h, at least 30 s, at most an hour), and a total cost over budget_usd books FAIL.

# Default prices for every lane (and for lane `any`); a lane's own [lanes.<name>.prices] overrides them key by key.
[prices]
usd_per_mtok_in = 0.24
usd_per_mtok_cached = 0.05
usd_per_mtok_out = 2.20

[git]
push = false                   # claims are a local commit; true also pushes them (git is then the cross-host lock)

# Any predicate that fires starts an autonomous reflection pass in autopilot; a missing key = off.
# The pass acts directly, and its child exit records the pass and restarts the cadence (pit/reflect.py).
[reflect]
rows = 64                       # counted work rows since the last recorded pass
hours = 8                       # hours since the last reflect
after = ["result:invalid"]      # a row of this type: cancel, decision, result:<verdict>, node:<kind>
spend_rising = 3                # the last N results each cost more than the one before

[lanes.gpu-small]
box = "a small GPU: short rollouts, probes"
usd_per_h = 14
slots = 1                       # GPU-exclusive
max_usd_per_value = 25          # cheap lane: q add refuses budget_usd > value x this
gate = "true"                   # a shell command; exit 0 = the lane is free
# repo = "~/src/project"      # local lane: fresh detached worktree per run, cwd at the tree
# base = "main"               # default HEAD; a spec's ref wins; no ref = baseline run
# house_seed = 0              # this lane's roots get no house seed (default: [pit] house_seed)
# prepare = "sh tools/inputs.sh"   # runs inside the tree before every job (ignored inputs, deps); non-zero = INVALID "prepare: <last line>"
# deny_paths = ["bench/driver/**", "bench/grade.py"]  # globs: a post whose diff base...ref touches one is refused
# {tree} in runner or run is shell-quoted; PIT_TREE / PIT_REF name the tree and commit; cleanup after every run
# device = "gpu0"              # lanes that share a device declare it; they never run together (one job on the device at a time)
# A spec with `scenario = "<name>"` and no `run` gets its driver from the lane: {scenario} {model} {funded_s} are filled in,
# and `preflight` (optional) must exit 0 before the job is dispatched; it may also prepare the box (pull an image, warm a
# cache) as long as it exits 0 when done. Without a runner a lane takes only `run` jobs.
# runner = "python3 bench.py --scenario {scenario} --model {model} --timeout {funded_s}"
# preflight = "python3 bench.py --check --model {model}"
# model = "small"               # a hand-written `run` on another lane may not name this model with --model
# [lanes.gpu-small.prices]      # this lane's own prices, over [prices]
# usd_per_mtok_out = 1.10
# usd_per_gpu_mem_gb_h = 0.02   # any meter the run reports, e.g. meters={"gpu_mem_gb_h": 3.5}

[lanes.gpu-large]
box = "a large GPU box that also serves production"
usd_per_h = 100
slots = 1
# Admit bench work only while production is idle, e.g.:
# gate = """curl -sf -m 3 http://localhost:9100/metrics | awk '$1=="inflight_requests"{f=1; exit ($2>0)} END{if(!f) exit 1}'"""
gate = "true"

[lanes.ci]
box = "self-hosted CI runners: builds, release rehearsals"
usd_per_h = 100                 # a 17-min rehearsal = $28
slots = 1
gate = "true"
# A lane with `url` runs its jobs on a runner service on that box (`q runner`, docs/runner.md) instead of forking them
# here. With `repo`, the runner keeps a checkout of it, moves it to the spec's `ref` (else this lane's `base`, else HEAD)
# and runs the job's command there; without, it runs the command in its own working directory. The runner kills the run
# when the funding runs out and reports the whole request's wall. Point the gate at its health check.
# url = "http://ci-box:8791"
# repo = "https://example.com/you/project.git"
# base = "main"
# gate = "curl -sf -m 3 http://ci-box:8791/health"

# A lane for reads (kind = "read": a funded run with no market; it buys framing, not a verdict). Uncomment to use; it is
# left commented here because every lane's usd_per_h adds to the minted income.
# [lanes.lens]
# box = "reads: cheap qualitative runs that show what a wording makes the model reach for"
# usd_per_h = 2                 # priced low: a read costs a fraction of a rollout
# slots = 1
# gate = "true"
# device = "gpu0"              # reads on gpu-small's GPU: set the same device on both lanes
# runner = "python3 lens_read.py {scenario}"    # a placeholder for your read driver; it ends with pit: verdict=read result={"readout": "<path or text>"}

# `any` is built in: wherever the session is; charged its meters only, at [prices].

# The scenario registry: `q list --scenarios` prints the entries of this directory (relative to the state root; one file
# or directory per scenario, named by its stem), and `q add` refuses a scenario not in it. No directory = any name.
# scenario_cmd, when set, replaces the directory: a shell command run in the state root whose last stdout line is a JSON
# list of scenario names (anything printed before it, such as warnings, is ignored). At post time on local repo lanes,
# it runs inside the proposed tree with PIT_TREE / PIT_REF and {tree}; otherwise it runs in the state root.
# drivers, when set, turns on the verdict-line rule: a hand-written `run` must print `pit: verdict=...` itself (contain
# `verdict=`) or start with one of these commands, which print the report line for it.
[bench]
scenario_dir = "scenarios"
# scenario_cmd = "python3 bench.py --list-scenarios"
# drivers = ["python3 bench.py", "examples/adapters/shell/run.sh"]

# Pit: agents fund runs and bet PASS/FAIL per variant; the frontier is ordered by matched stakes (the most uncertain
# runs first, ties cheapest). enabled = false restores the default ranking (priority, critical path, value per $).
[pit]
enabled = true
rank = "matched"                # "matched" | "matched_per_usd" (matched stakes divided by budget_usd)
max_posts_per_hour = 0          # per wallet (the house is exempt); 0 (the default) = off: a post's funding is the limiter
mint = 1.0                      # income per minute = mint x the sum of lane usd_per_h / 60; 1.0 = every lane sold every minute
default_stake = 0.25            # the floor of the automatic stake a post puts on PASS, per variant
stake_share = 0.25              # that stake = max(default_stake, stake_share x budget_usd): bigger runs open bigger pots
vig_rate = 0.02                 # of each settled pot, to the house
blind = true                    # agents see no pools, odds, backers or whys of others' bets (q board --as, wake prompts); humans see all
house_seed = 1.00               # the house stakes a reflect-planted root this much per variant from its vig, capped by the pool
# max_agents = 6                # active persistent agents at once (0 = no cap): planting a new one needs a retirement first

# q autopilot (pit/autopilot.py): dispatch per free lane, hand results back to the proposer, reflect when due.
[autopilot]
# max_usd_per_hour = 40         # unset or 0 (the default) = no spend gate: hour spend is reported, never enforced
# max_concurrent_subagents = 3  # unset = one per persistent agent + 1 for the reflection pass
max_subagent_runs_per_hour = 60  # a budget, not a gate: over it the loop writes one `auto refuse` row per hour and keeps going
idle_wake_gap_s = 90            # agents never sleep: each persistent agent is re-woken this long after its last turn ends
market_wake_floor_s = 30        # a new market by another agent wakes everyone else at once, at most once per this many s per agent
any_workers = 2                 # lane `any` runs this many jobs at once
permission_mode = ""            # claude -p --permission-mode; "" = the repo's, then the user's Claude Code defaultMode
allowed_tools = []              # e.g. ["Bash(q *)", "Read", "Grep", "Edit"] -> --allowedTools; pair with permission_mode = "acceptEdits"
# workspace = "~/src/agent-trees/{agent}"    # a wallet's tree, shared by its successive turns
# workspace_init = "git -C ~/src/project worktree add -b work/{agent} {path} main"  # only when missing
# Init receives shell-quoted {agent} and {path}; both runtimes get the tree via --add-dir.
# Permit Git status, diff, log, add, commit, switch/checkout, rev-parse, worktree list, stash and restore in allowed_tools.
add_dirs = []                   # directories a desk job may touch (each -> --add-dir), e.g. ["~/src/my-project"]
heartbeat_minutes = 20          # an idle, funded agent asleep until-event is woken after this long without acting (reason `heartbeat`)
heartbeat_min_usd = 1.0         # ...if its balance is at least this (the cheapest lane's minimum post)
# Agent runtimes: an agent row may carry runtime = "claude" | "codex" and a model (`q agent add/set --runtime --model`).
runtimes.claude.model = "sonnet"        # an agent with no model of its own, on claude
# runtimes.claude.args = []             # extra claude -p args
# runtimes.codex.model = "<codex-model>"  # unset = the codex CLI's own configured default
# runtimes.codex.args = ["--skip-git-repo-check", "--sandbox", "workspace-write", "-c", 'approval_policy="never"']   # the default
# reflect.runtime = "claude"            # autonomous reflection: claude (default) or codex
# reflect.model = "opus"                # override; default opus on claude, runtimes.codex.model on codex
# If runtimes.codex.model is also unset, codex uses its own CLI configuration.
# Runs and agent turns get <this repo>/bin first on PATH: `q`, and `python3` = scripts/py.sh (a Python >= 3.11 with pit
# importable). Put your own tools on PATH before starting autopilot.
# kill file: autopilot/STOP (checked every tick). Standing rules injected into every prompt: pit.autopilot.RULES

# The bag (pit/bag.py): a lane with nothing runnable draws one known-good spec (least recently run first), posts it as
# `house` (tag `bag`, a house PASS stake of house_stake usd per variant from the vig pool) and runs it. A failed run
# becomes a "REGRESSION:" finding naming the spec's last pass. budget_usd is the fallback for a spec without its own;
# bag spend counts against the hour cap if one is set; one bag job per lane at a time; a spec may carry its own max_per_day;
# an `invalid` draw does not count toward the day. Paths are relative to the state root. Scalars here apply to every lane
# unless its [bag.<lane>] sets its own.
[bag]
backoff_minutes = 30           # after an `invalid` bag result the lane draws nothing for this long; x2 per further consecutive invalid, cap 4 h
min_interval_minutes = 120     # a spec (or any job on the same scenario and lane) is drawn at most this often
quarantine_after = 3           # this many fail/invalid results in a row take a spec out of the rotation (auto note `bag-readmit <spec>` restores it;
                               # `bag-reset <lane>` clears a lane's invalid backoff)

[bag.gpu-small]
specs = ["bag/gpu-small-*.toml"]
max_per_day = 6
budget_usd = 0.5
house_stake = 0.25
enabled = true

[bag.gpu-large]
specs = ["bag/gpu-large-*.toml"]
max_per_day = 2
budget_usd = 1
house_stake = 0.25
enabled = true

[bag.ci]
specs = ["bag/ci-*.toml"]
max_per_day = 2
budget_usd = 1
house_stake = 0.25
enabled = false                 # off until you want the house running builds
