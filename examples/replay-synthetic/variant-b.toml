id = "variant-b"
question = "Does variant B beat A on the held-out set?"
if_pass = "promote B; queue the ablation"
if_fail = "keep A as the default"
lane = "gpu-small"
budget_usd = 8
proposer = "explorer"
depends_on = ["baseline-a"]
inputs = { baseline = "{{ jobs.baseline-a.result.acc }}" }
run = "python3 eval.py --variant B --set heldout --beat {{ inputs.baseline }}"
produces_if_pass = ["F:b-beats-a"]

